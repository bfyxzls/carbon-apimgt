<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>carbon-apimgt 多模块数据调用与解耦</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · carbon-apimgt</p>
    <h1>多模块数据调用与业务解耦</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="apimgt-decouple-title apimgt-decouple-desc">
        <title id="apimgt-decouple-title">多模块数据调用与业务解耦</title>
        <desc id="apimgt-decouple-desc">泳道图展示 carbon-apimgt 运行时鉴权转发与控制面落库两条路径，经事件总线异步同步实现模块解耦。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Lane bands -->
        <line x1="40" y1="48" x2="1240" y2="48" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <line x1="40" y1="148" x2="1240" y2="148" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <line x1="40" y1="248" x2="1240" y2="248" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <line x1="40" y1="348" x2="1240" y2="348" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <line x1="40" y1="448" x2="1240" y2="448" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <line x1="40" y1="548" x2="1240" y2="548" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <line x1="176" y1="48" x2="176" y2="548" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

        <!-- Lane labels (Chinese register: 12px sans) -->
        <text x="56" y="104" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">客户端</text>
        <text x="56" y="204" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">网关</text>
        <text x="56" y="304" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">密钥验证</text>
        <text x="56" y="404" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">控制面</text>
        <text x="56" y="504" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">事件总线</text>

        <!-- Arrows first -->
        <!-- 1 → 2 HTTP request (link) -->
        <path d="M 344,98 H 466 Q 474,98 474,106 V 172" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- 2 → 3 validate -->
        <path d="M 474,224 V 290 Q 474,298 482,298 H 600" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 3 → 4 token info back to gateway -->
        <path d="M 760,298 H 886 Q 894,298 894,290 V 224" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 4 → 5 analytics async -->
        <path d="M 910,224 V 490 Q 910,498 918,498 H 1040" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- 6 → 7 control plane -->
        <line x1="344" y1="398" x2="420" y2="398" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 7 → 8 critical decoupling handoff (accent) -->
        <path d="M 500,424 V 490 Q 500,498 508,498 H 660" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- 8 → 4 cache sync (async feedback) -->
        <path d="M 740,472 V 248 Q 740,240 748,240 H 852 Q 860,240 860,232 V 224" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- Arrow labels (Chinese → 12px sans, 16px mask) -->
        <rect x="372" y="74" width="56" height="16" rx="2" fill="#f5f5f5"/>
        <text x="400" y="86" fill="#2e5aa8" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">请求</text>

        <rect x="488" y="248" width="56" height="16" rx="2" fill="#f5f5f5"/>
        <text x="516" y="260" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">校验</text>

        <rect x="788" y="248" width="80" height="16" rx="2" fill="#f5f5f5"/>
        <text x="828" y="260" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">验证信息</text>

        <rect x="920" y="348" width="80" height="16" rx="2" fill="#f5f5f5"/>
        <text x="960" y="360" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">异步发布</text>

        <rect x="348" y="374" width="56" height="16" rx="2" fill="#f5f5f5"/>
        <text x="376" y="386" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">契约</text>

        <rect x="532" y="448" width="80" height="16" rx="2" fill="#f5f5f5"/>
        <text x="572" y="460" fill="#bf4520" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">发布通知</text>

        <rect x="752" y="328" width="80" height="16" rx="2" fill="#f5f5f5"/>
        <text x="792" y="340" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">缓存同步</text>

        <!-- Nodes -->
        <!-- 1 Invoke — input -->
        <rect x="196" y="72" width="148" height="52" rx="6" fill="#f5f5f5"/>
        <rect x="196" y="72" width="148" height="52" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="270" y="94" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">发起 API 调用</text>
        <text x="270" y="110" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">HTTP(S)</text>

        <!-- 2 Authenticate — backend -->
        <rect x="400" y="172" width="148" height="52" rx="6" fill="#f5f5f5"/>
        <rect x="400" y="172" width="148" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="474" y="194" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">网关认证</text>
        <text x="474" y="210" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">OAuth / JWT / ApiKey</text>

        <!-- 3 Validate — security -->
        <rect x="600" y="272" width="160" height="52" rx="6" fill="#f5f5f5"/>
        <rect x="600" y="272" width="160" height="52" rx="6" fill="rgba(191,69,32,0.05)" stroke="rgba(191,69,32,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
        <text x="680" y="294" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">令牌与订阅校验</text>
        <text x="680" y="310" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">APIKeyValidationService</text>

        <!-- 4 Mediate — backend -->
        <rect x="820" y="172" width="148" height="52" rx="6" fill="#f5f5f5"/>
        <rect x="820" y="172" width="148" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="894" y="194" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">转发后端</text>
        <text x="894" y="210" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Synapse mediate</text>

        <!-- 5 Analytics — optional/async -->
        <rect x="1040" y="472" width="160" height="52" rx="6" fill="#f5f5f5"/>
        <rect x="1040" y="472" width="160" height="52" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="1120" y="494" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">分析数据采集</text>
        <text x="1120" y="510" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">common.analytics</text>

        <!-- 6 Manage REST — backend -->
        <rect x="196" y="372" width="148" height="52" rx="6" fill="#f5f5f5"/>
        <rect x="196" y="372" width="148" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="270" y="394" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">管理面 REST</text>
        <text x="270" y="410" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Publisher/Store/Admin</text>

        <!-- 7 Persist — store -->
        <rect x="420" y="372" width="160" height="52" rx="6" fill="#f5f5f5"/>
        <rect x="420" y="372" width="160" height="52" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="500" y="394" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">业务落库</text>
        <text x="500" y="410" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">api → impl → persistence</text>

        <!-- 8 Event sync — focal -->
        <rect x="660" y="472" width="160" height="52" rx="6" fill="#f5f5f5"/>
        <rect x="660" y="472" width="160" height="52" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="740" y="494" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">事件异步同步</text>
        <text x="740" y="510" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Notifier → JMS → GW/KM</text>

        <!-- Legend -->
        <line x1="40" y1="580" x2="1240" y2="580" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="604" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="624" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="60" y="633" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">步骤</text>

        <rect x="120" y="624" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="140" y="633" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">解耦焦点</text>

        <rect x="232" y="624" width="14" height="10" rx="2" fill="rgba(191,69,32,0.05)" stroke="rgba(191,69,32,0.50)" stroke-width="1" stroke-dasharray="3,2"/>
        <text x="252" y="633" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">安全边界</text>

        <line x1="348" y1="629" x2="376" y2="629" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="384" y="633" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">HTTP 调用</text>

        <line x1="488" y1="629" x2="516" y2="629" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="524" y="633" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">关键移交</text>

        <line x1="628" y1="629" x2="656" y2="629" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="664" y="633" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">异步 / 回流</text>
      </svg>
    </div>
  </div>
</body>
</html>
